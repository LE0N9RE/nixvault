# Mango configuration
# Documentation: https://github.com/DreamMaoMao/mango/wiki/


# =============================================================================
# Startup
# =============================================================================

exec-once = awww-daemon
exec-once = awww img ~/dotfiles/wallpaper/3.jpeg


# =============================================================================
# Display
# =============================================================================

monitorrule=name:eDP-1,width:1920,height:1080,refresh:60,x:0,y:0,scale:1.5,vrr:0,rr:0

export GDK_DPI_SCALE=0.9
export QT_SCALE_FACTOR=0.9


# =============================================================================
# Window Appearance
# =============================================================================

border_radius=6
borderpx=1

no_border_when_single=1
no_radius_when_single=0

focused_opacity=1.0
unfocused_opacity=1.0

gappih=5
gappiv=5
gappoh=10
gappov=10

rootcolor=0x201b14ff
bordercolor=0
dropcolor=0xFFFFFFFF
splitcolor=0xEB441EFF
focuscolor=0x33ccffff
maximizescreencolor=0x89aa61ff
urgentcolor=0xAD401FFF
scratchpadcolor=0x516C93FF
globalcolor=0xB153A7FF
overlaycolor=0x14A57CFF

scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9


# =============================================================================
# Blur
# =============================================================================

blur=0
blur_layer=0
blur_optimized=1

blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2


# =============================================================================
# Shadows
# =============================================================================

shadows=0
layer_shadows=0
shadow_only_floating=1

shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x000000FF


# =============================================================================
# Animations
# =============================================================================

animations=1
layer_animations=0

# Opening: zoom in and fade
animation_type_open=zoom
animation_fade_in=1
animation_duration_open=170
zoom_initial_ratio=0.8
zoom_end_ratio=1.0
fadein_begin_opacity=0.0

# Closing: zoom out and fade
animation_type_close=zoom
animation_fade_out=1
animation_duration_close=150
fadeout_begin_opacity=1.0

# Window and workspace movement
tag_animation_direction=1
animation_duration_move=170
animation_duration_tag=250
animation_duration_focus=150

# Animation curves
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_focus=0.05,0.9,0.1,1.05
animation_curve_tag=0.25,1,0.5,1
animation_curve_opafadeout=0.25,1,0.5,1
animation_curve_opafadein=0.25,1,0.5,1


# =============================================================================
# Scroller Layout
# =============================================================================

scroller_structs=20
scroller_default_proportion=0.8
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

scroller_focus_center=0
scroller_prefer_center=0

edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0


# =============================================================================
# Master-Stack Layout
# =============================================================================

new_is_master=1
default_mfact=0
default_nmaster=1
smartgaps=0


# =============================================================================
# Dwindle Layout
# =============================================================================

dwindle_smart_split=0
dwindle_drop_simple_split=0.5
dwindle_manual_split=0
dwindle_hsplit=0
dwindle_vsplit=0
dwindle_preserve_split=0


# =============================================================================
# Overview
# =============================================================================

enable_hotarea=0
hotarea_size=10

ov_tab_mode=1
ov_no_resize=1

overviewgappi=5
overviewgappo=30


# =============================================================================
# Focus, Cursor, and Window Behavior
# =============================================================================

focus_on_activate=1
sloppyfocus=1
warpcursor=1

focus_cross_monitor=0
focus_cross_tag=0

idleinhibit_ignore_visible=0
axis_bind_apply_timeout=100

enable_floating_snap=0
snap_distance=30

cursor_size=24

drag_tile_to_tile=1
drag_tile_small=1


# =============================================================================
# Keyboard
# =============================================================================

repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us


# =============================================================================
# Touchpad
# Requires relogin for some changes
# =============================================================================

disable_trackpad=0

tap_to_click=1
tap_and_drag=1
drag_lock=1

trackpad_natural_scrolling=0
disable_while_typing=1

left_handed=0
middle_button_emulation=0

swipe_min_threshold=1


# =============================================================================
# Mouse
# Requires relogin for some changes
# =============================================================================

mouse_natural_scrolling=0


# =============================================================================
# Workspace Layouts
#
# Supported layouts:
# tile, scroller, grid, deck, monocle, center_tile,
# vertical_tile, vertical_scroller, dwindle
# =============================================================================

tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle


# =============================================================================
# Essential Keybindings
# =============================================================================

# Reload configuration
bind=SUPER+SHIFT,r,reload_config

# Application launcher
bind=SUPER,R,spawn,rofi -show drun

# Terminal
bind=SUPER,Q,spawn,kitty --class=kitty-float --override remember_window_size=no

# File manager
bind=SUPER,E,spawn,nautilus

# Close focused window
bind=SUPER,C,killclient,

# Exit Mango
bind=SUPER,M,quit


# =============================================================================
# Window States
# =============================================================================

bind=SUPER,V,togglefloating,
bind=SUPER,P,pseudo,
bind=SUPER,J,dwindle_toggle_split_direction

bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=ALT,backslash,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,

bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized

bind=SUPER,o,toggleoverlay,
bind=ALT,z,toggle_scratchpad


# =============================================================================
# Window Focus
# =============================================================================

bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down


# =============================================================================
# Move and Exchange Windows
# =============================================================================

bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down


# =============================================================================
# Layout Controls
# =============================================================================

bind=ALT+SHIFT,Return,dwindle_toggle_split_direction
bind=SUPER,n,switch_layout
bind=ALT+SHIFT,R,togglegaps


# =============================================================================
# Workspace Navigation
# =============================================================================

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0


# =============================================================================
# Move Windows to Workspaces
# =============================================================================

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0


# =============================================================================
# Monitor Controls
# =============================================================================

bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right

bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right


# =============================================================================
# Audio and Brightness
# =============================================================================

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl set 5%-


# =============================================================================
# Mouse Bindings
# =============================================================================

# Super + left-drag: move window
mousebind=SUPER,btn_left,moveresize,curmove

# Super + right-drag: resize window
mousebind=SUPER,btn_right,moveresize,curresize


# =============================================================================
# Layer Rules
# =============================================================================

layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
