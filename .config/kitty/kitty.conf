# --- size ---
font_size 14.0

# --- Cursor Settings ---
cursor                  #a0b0ff
cursor_text_color       background

# --- Window Border Settings ---
# White, thin, and sharp (non-rounded) edges
window_border_width     1px
active_border_color     #ffffff
inactive_border_color   #444444
window_margin_width     0
window_padding_width    0

# --- Updated Color Scheme ---
# Let's make the typed text (foreground) brighter, but still a bit darker than the prompt
foreground              #95a5e0
background              #000000
# Your prompt color (from earlier)
color4                  #89b4fa

# Your cursor (lightest of them all)
cursor                  #c2ceff

# --- Selection Colors ---
selection_foreground    #1e1e2e
selection_background    #95a5e0

# Color 4 is typically used for the directory/name in prompts (ANSI Blue)
# We make it brighter than the typed text (foreground)
color4                  #89b4fa

# Setting background opacity
background_opacity 0.7

# --- Shell Prompt Color ---
# This changes the color of the [a3n@nixos:~]$ prompt
color4                  #89b4fa
color12                 #a6e3a1

confirm_os_window_close 0

remember_window_size  no
initial_window_width  500
initial_window_height 200
